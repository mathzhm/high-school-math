<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中数学复习 · 目录总页</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;
       background:linear-gradient(135deg,#e8f0fa 0%,#f0f4f8 100%);
       color:#333;padding:30px 20px;min-height:100vh;}
  .header{text-align:center;margin-bottom:20px;}
  .header h1{color:#2c5f8a;font-size:30px;margin-bottom:8px;}
  .header p{color:#7a8ba0;font-size:15px;}
  .top-entry{text-align:center;margin-bottom:30px;}
  .top-entry a{display:inline-block;background:#ec7a7a;color:#fff;text-decoration:none;
       padding:12px 32px;border-radius:24px;font-size:16px;font-weight:bold;
       box-shadow:0 4px 12px rgba(236,122,122,.35);transition:transform .2s;}
  .top-entry a:hover{transform:translateY(-2px);}

  .grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;max-width:1000px;margin:0 auto;}
  .topic{background:#fff;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.08);
         padding:24px;width:300px;transition:transform .25s,box-shadow .25s;
         display:flex;flex-direction:column;}
  .topic:hover{transform:translateY(-6px);box-shadow:0 12px 28px rgba(0,0,0,.14);}
  .topic .num{display:inline-block;align-self:flex-start;background:#2c5f8a;color:#fff;
              font-size:13px;padding:3px 12px;border-radius:12px;margin-bottom:12px;}
  .topic h2{color:#2c5f8a;font-size:21px;margin-bottom:8px;}
  .topic .kp{color:#8290a3;font-size:13px;line-height:1.7;margin-bottom:18px;
             min-height:44px;flex:1;}
  .topic .btns{display:flex;gap:8px;}
  .topic a{flex:1;text-align:center;text-decoration:none;padding:10px 0;
           border-radius:10px;font-size:13px;font-weight:bold;transition:opacity .2s;}
  .topic a:hover{opacity:.85;}
  .btn-video{background:#4a90d9;color:#fff;}
  .btn-do{background:#f4b860;color:#fff;}
  .btn-quiz{background:#7bc47f;color:#fff;}

  .mascot{position:fixed;right:20px;bottom:20px;width:100px;z-index:99;
          filter:drop-shadow(0 4px 10px rgba(0,0,0,.2));transition:transform .3s;}
  .mascot:hover{transform:scale(1.08) rotate(-3deg);}
  footer{text-align:center;color:#9aa7bb;margin-top:40px;font-size:13px;}
  .empty{text-align:center;color:#9aa7bb;width:100%;padding:40px 0;font-size:15px;}
  @media(max-width:600px){.mascot{width:70px;}}
</style>
</head>
<body>
  <div class="header">
    <h1>📚 高中数学复习中心</h1>
    <p>活力酷酷兔数学小课堂 · 选择一个专题开始复习</p>
  </div>

  <!-- 全局错题本入口（跨所有章节，看全部错题） -->
  <div class="top-entry">
    <a href="错题本.html">📕 打开我的错题本（全部章节）</a>
  </div>

  <!-- 卡片区：由 chapters.js 自动生成，无需手动维护 -->
  <div class="grid" id="grid"></div>

  <img src="兔子.png" alt="活力酷酷兔" class="mascot">
  <footer>活力酷酷兔数学小课堂 · 持续更新中</footer>

  <!-- 唯一数据源 -->
  <script src="chapters.js"></script>
  <script>
    // 中文数字，用于「专题一 / 专题二 …」标签
    const CN = ["一","二","三","四","五","六","七","八","九","十",
                "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十"];

   // HTML 转义，防止章节名里的 < > & 破坏页面
    const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");


    function render(){
      const grid = document.getElementById("grid");

      // 容错：chapters.js 未加载或为空
      if (typeof CHAPTERS === "undefined" || !Array.isArray(CHAPTERS) || CHAPTERS.length === 0){
        grid.innerHTML = '<div class="empty">暂无章节数据，请检查 chapters.js 是否正确加载。</div>';
        return;
      }

      grid.innerHTML = CHAPTERS.map((ch, i) => {
        const numLabel = "专题" + (CN[i] || (i + 1));
        // 简介优先用 desc；没有 desc 则自动拼接知识点名
        const kp = ch.desc && ch.desc.trim()
          ? ch.desc
          : (ch.topics || []).map(t => t.name).join(" · ");
        // 章节名作为网址参数，用 encodeURIComponent 处理中文，保证跳转可靠
        const q = encodeURIComponent(ch.name);
        return `
          <div class="topic">
            <span class="num">${numLabel}</span>
            <h2>${esc(ch.name)}</h2>
            <div class="kp">${esc(kp)}</div>
            <div class="btns">
              <a class="btn-video" href="视频页.html?ch=${q}">🎬 视频</a>
              <a class="btn-do"    href="做题本.html?ch=${q}">✏️ 做题</a>
              <a class="btn-quiz"  href="错题本.html?ch=${q}">📒 错题本</a>
            </div>
          </div>`;
      }).join("");
    }

    render();
  </script>
</body>
</html>
