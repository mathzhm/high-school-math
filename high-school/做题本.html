<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中数学 · 做题本</title>
<script src="chapters.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#eaf2ff,#f5f9ff); color:#333; line-height:1.7; padding:16px; }
  .container { max-width:1000px; margin:0 auto; }
  .header { text-align:center; background:linear-gradient(135deg,#7b9cf0,#a6bef5);
    color:#fff; padding:22px; border-radius:20px; margin-bottom:14px; box-shadow:0 6px 20px rgba(123,156,240,.3); }
  .header h1 { font-size:24px; margin-bottom:4px; }
  .header p { font-size:13px; opacity:.95; }
  .links { text-align:center; margin-bottom:14px; }
  .links a { color:#5a7fd6; font-weight:bold; text-decoration:none; font-size:13px; margin:0 10px; }
  .links a.wrong { color:#ec7a7a; }
  .main-tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .main-tab { padding:10px 22px; border:none; border-radius:24px; cursor:pointer;
    font-size:15px; font-weight:bold; background:#fff; color:#7b8bad; box-shadow:0 2px 8px rgba(0,0,0,.05); transition:all .2s; }
  .main-tab.active { background:#7b9cf0; color:#fff; }
  .panel { display:none; } .panel.active { display:block; }
  .card { background:#fff; border-radius:18px; padding:22px; margin-bottom:16px; box-shadow:0 4px 15px rgba(0,0,0,.06); }
  .card h2 { color:#5a7fd6; font-size:19px; margin-bottom:6px; }
  .card .desc { font-size:13px; color:#999; margin-bottom:14px; }
  .diff-tabs { display:flex; gap:6px; margin-bottom:14px; }
  .diff-tab { flex:1; border:none; padding:7px 0; border-radius:20px; cursor:pointer; font-size:13px; font-weight:bold; background:#eef2fb; color:#7b8bad; transition:all .2s; }
  .diff-tab.easy.active { background:#6ac48a; color:#fff; }
  .diff-tab.mid.active  { background:#f4b860; color:#fff; }
  .diff-tab.hard.active { background:#ec7a7a; color:#fff; }
  .diff-content { display:none; } .diff-content.active { display:block; }
  .q { background:#f8faff; border-radius:12px; padding:16px; margin-bottom:14px; }
  .q .stem { font-weight:bold; margin-bottom:10px; }
  .opt { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid #e0e7f5; border-radius:10px; padding:9px 14px; margin-bottom:8px; cursor:pointer; font-size:14px; transition:all .15s; }
  .opt:hover { border-color:#7b9cf0; }
  .opt.correct { background:#eafaf0; border-color:#6ac48a; color:#2f7d4f; font-weight:bold; }
  .opt.wrong   { background:#fdeaea; border-color:#ec7a7a; color:#c0392b; font-weight:bold; }
  .opt:disabled { cursor:default; }
  .feedback { font-size:13px; margin-top:6px; font-weight:bold; }
  .feedback.ok { color:#2f7d4f; } .feedback.no { color:#c0392b; }
  .err { text-align:center; color:#c0392b; padding:40px; }
  .footer { text-align:center; color:#999; font-size:13px; padding:16px; }
  .mascot { position:fixed; right:12px; bottom:12px; width:100px; z-index:100; }
  .mascot img { width:100%; border-radius:12px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🐰 高中数学 · 做题本</h1>
    <p>选章节 · 做选择题 · 自动判分 · 答错自动进错题本</p>
  </div>
  <div class="links">
    <a href="目录总页.html">← 返回目录</a>
    <a class="wrong" href="错题本.html">📕 去错题本 →</a>
  </div>
  <div class="main-tabs" id="mainTabs"></div>
  <div id="panels"></div>
  <div class="footer">答错别灰心，进错题本再战一次！</div>
</div>
<div class="mascot"><img src="兔子.png" alt="酷酷兔"></div>

<script>
const STORAGE_KEY = "math_wrong_book";
const LETTER = ["A","B","C","D","E","F"];
const DIFFS = [["easy","简单","easy"],["mid","中等","mid"],["hard","困难","hard"]];

/* HTML 转义，防止题目里的 < > & 破坏页面结构 */
function esc(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

if (typeof CHAPTERS === "undefined" || !CHAPTERS.length) {
  document.getElementById("panels").innerHTML =
    `<div class="err">未能加载题库（chapters.js）。请确认该文件与本页在同一文件夹。</div>`;
} else {
  buildTabs();
  buildPanels();
  applyHash();
  window.addEventListener("hashchange", applyHash);
}

function buildTabs(){
  const box = document.getElementById("mainTabs");
  box.innerHTML = CHAPTERS.map((c,i)=>
    `<button class="main-tab" onclick="showPanel(${i})" data-idx="${i}">${i+1}. ${esc(c.name)}</button>`
  ).join("");
}

function buildPanels(){
  const box = document.getElementById("panels");
  box.innerHTML = CHAPTERS.map((c,ci)=>`
    <div class="panel" id="panel-${ci}">
      <div class="card">
        <h2>${esc(c.name)}</h2>
        <div class="desc">${esc(c.desc||"")} 点选项即可自动判分，答错自动进错题本。</div>
        <div class="diff-tabs">
          ${DIFFS.map((d,di)=>`<button class="diff-tab ${d[2]} ${di===0?'active':''}" onclick="switchDiff(${ci},'${d[0]}',this)">${d[1]}</button>`).join("")}
        </div>
        ${DIFFS.map((d,di)=>`<div class="diff-content ${di===0?'active':''}" id="dc-${ci}-${d[0]}"></div>`).join("")}
      </div>
    </div>
  `).join("");
  CHAPTERS.forEach((c,ci)=> DIFFS.forEach(d=> renderDiff(ci, d[0])));
}

/* 把一个章节下"所有知识点"的某一难度题目合并渲染 */
function renderDiff(ci, diff){
  const chapter = CHAPTERS[ci];
  const container = document.getElementById(`dc-${ci}-${diff}`);
  let html = "";
  let globalIdx = 0;
  chapter.topics.forEach((topic, ti)=>{
    const list = (topic.practice && topic.practice[diff]) || [];
    list.forEach((q, qi)=>{
      globalIdx++;
      const opts = q.options.map((o,j)=>
        `<button class="opt" onclick="answer(this,${ci},${ti},'${diff}',${qi},${j})">${LETTER[j]}. ${esc(o)}</button>`
      ).join("");
      html += `<div class="q"><div class="stem">${globalIdx}. ${esc(q.stem)}
        <span style="font-weight:normal;color:#a9b4c7;font-size:12px;">〔${esc(topic.name)}〕</span></div>
        ${opts}<div class="feedback"></div></div>`;
    });
  });
  container.innerHTML = html || `<div class="q">该难度暂无练习题。</div>`;
}

function answer(btn, ci, ti, diff, qi, chosen){
  const qDiv = btn.closest(".q");
  if(qDiv.dataset.done) return; qDiv.dataset.done = "1";
  const q = CHAPTERS[ci].topics[ti].practice[diff][qi];
  const opts = qDiv.querySelectorAll(".opt"); opts.forEach(o=>o.disabled=true);
  const fb = qDiv.querySelector(".feedback");
  opts[q.answer].classList.add("correct");
  if(chosen === q.answer){ fb.textContent="✅ 回答正确！"; fb.className="feedback ok"; }
  else {
    btn.classList.add("wrong"); fb.textContent="❌ 答错了，已加入错题本。"; fb.className="feedback no";
    saveWrong({
      id: "w_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
      chapter: CHAPTERS[ci].name,
      topic: CHAPTERS[ci].topics[ti].name,
      level: diff,
      stem: q.stem,
      correct: LETTER[q.answer]+". "+q.options[q.answer],
      chosen: LETTER[chosen]+". "+q.options[chosen],
      time: new Date().toLocaleString("zh-CN")
    });
  }
}

function saveWrong(item){
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
  data.push(item); localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function showPanel(idx){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".main-tab").forEach(t=>t.classList.remove("active"));
  document.getElementById("panel-"+idx).classList.add("active");
  document.querySelector('.main-tab[data-idx="'+idx+'"]').classList.add("active");
}

function switchDiff(ci, diff, btn){
  const card = btn.closest(".card");
  card.querySelectorAll(".diff-tab").forEach(t=>t.classList.remove("active"));
  card.querySelectorAll(".diff-content").forEach(c=>c.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(`dc-${ci}-${diff}`).classList.add("active");
}

/* 支持从目录总页跳转：做题本.html#do=章节名 */
function applyHash(){
  // 优先读 ?ch=，兼容旧的 #do=
  const p = new URLSearchParams(location.search).get("ch");
  let name = p || "";
  if(!name && location.hash.startsWith("#do=")){
    name = decodeURIComponent(location.hash.slice(4));
  }
  let idx = 0;
  if(name){
    const found = CHAPTERS.findIndex(c => c.name === name);
    if(found > -1) idx = found;
  }
  showPanel(idx);
}
</script>
</body>
</html>
