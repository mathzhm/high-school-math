<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频复习</title>
<script src="chapters.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f0f4f8; color: #333; padding: 20px; }
  h1 { text-align: center; color: #2c5f8a; margin-bottom: 6px; }
  .subtitle { text-align:center; color:#7a8ba0; font-size:14px; margin-bottom:20px; }

  /* 知识点 Tab（顶部） */
  .topic-tabs { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:22px; }
  .topic-tabs button { padding:9px 20px; border:none; border-radius:24px; cursor:pointer;
      font-size:14px; font-weight:bold; background:#e6ecf3; color:#2c5f8a;
      box-shadow:0 2px 6px rgba(0,0,0,.05); transition:all .2s; }
  .topic-tabs button.active { background:#2c5f8a; color:#fff; }

  /* 单个知识点面板：左右分栏容器 */
  .topic-panel { display:none; max-width:1080px; margin:0 auto; }
  .topic-panel.active { display:block; }
  .video-card { background:#fff; border-radius:14px; box-shadow:0 4px 14px rgba(0,0,0,.08); padding:20px; }
  .video-card h2 { color:#2c5f8a; font-size:19px; margin-bottom:14px; text-align:center; }

  /* ===== 左右两栏布局 ===== */
  .split { display:flex; gap:24px; align-items:flex-start; }

  /* 左栏：竖屏视频 */
  .video-col { flex:0 0 320px; position:sticky; top:20px; }
  .video-col video { width:100%; aspect-ratio:9/16; border-radius:10px; background:#000; display:block; }

  /* 右栏：自测题 */
  .quiz-col { flex:1; min-width:0; }

  /* 手机端：回退成上下堆叠 */
  @media(max-width:820px){
    .split { flex-direction:column; }
    .video-col { flex:none; width:100%; max-width:320px; margin:0 auto; position:static; }
    .quiz-col { width:100%; }
  }

  .ex-title { display:flex; align-items:center; gap:8px; margin:0 0 12px;
              font-size:17px; font-weight:bold; color:#2c5f8a;
              border-left:5px solid #f0a020; padding-left:10px; }
  .diff-tabs { display:flex; gap:8px; margin-bottom:16px; }
  .diff-tabs button { flex:1; padding:11px 0; border:none; cursor:pointer; font-size:15px;
      font-weight:bold; background:#e6ecf3; color:#2c5f8a; border-radius:24px; transition:all .2s; }
  .diff-tabs button.active { background:#7bc47f; color:#fff; box-shadow:0 3px 8px rgba(123,196,127,.4); }

  .qcard { background:#f6f8fb; border-radius:12px; padding:16px; margin-bottom:14px; }
  .qcard .qt { font-size:15px; line-height:1.7; margin-bottom:12px; }
  .qcard .qt b { margin-right:4px; }
  .ans-btn { background:#5b7cd6; color:#fff; border:none; padding:9px 20px; border-radius:10px; cursor:pointer; font-size:14px; }
  .ans-btn:hover { background:#4a6ac0; }
  .ans { display:none; margin-top:12px; padding:12px; background:#fff; border-left:4px solid #f0a020;
         border-radius:8px; color:#d35400; font-weight:bold; line-height:1.6; }
  .qcard.show .ans { display:block; }
  .qcard.show .ans-btn { background:#9aa7bd; }

  .back { text-align:center; margin-top:22px; }
  .back a { color:#5a7fd6; text-decoration:none; font-size:14px; font-weight:bold; }
  .err { text-align:center; color:#c0392b; padding:40px; font-size:16px; }
  footer { text-align:center; color:#999; margin-top:24px; font-size:13px; }
  .mascot-fixed { position:fixed; right:20px; bottom:20px; width:110px; z-index:999;
      filter:drop-shadow(0 4px 10px rgba(0,0,0,.2)); transition:transform .3s; }
  .mascot-fixed:hover { transform:scale(1.08) rotate(-3deg); }
  @media(max-width:600px){ .mascot-fixed{width:70px;right:10px;bottom:10px;} }
</style>
</head>
<body>
  <h1 id="pageTitle">视频复习</h1>
  <div class="subtitle">活力酷酷兔数学小课堂</div>

  <div class="topic-tabs" id="topicTabs"></div>
  <div id="panels"></div>

  <div class="back"><a href="目录总页.html">← 返回目录总页</a></div>
  <footer>活力酷酷兔数学小课堂</footer>
  <img src="兔子.png" alt="活力酷酷兔" class="mascot-fixed">

<script>
const LETTER = ["A","B","C","D","E","F"];

/* HTML 转义：防止题目里的 < > & 破坏页面结构 */
function esc(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* 读取网址参数 ?ch=章节名 */
function getParam(name){
  const m = new RegExp("[?&]"+name+"=([^&]*)").exec(location.search);
  return m ? decodeURIComponent(m[1]) : "";
}

const chName = getParam("ch");
const chapter = (typeof CHAPTERS !== "undefined") ? CHAPTERS.find(c => c.name === chName) : null;

if (!chapter) {
  document.getElementById("panels").innerHTML =
    `<div class="err">未找到章节「${esc(chName)||"（空）"}」。<br>请从目录总页点击进入。</div>`;
  document.getElementById("topicTabs").style.display = "none";
} else {
  document.title = chapter.name + " · 视频复习";
  document.getElementById("pageTitle").textContent = chapter.name + " · 视频复习";
  buildTopicTabs();
  buildPanels();
  activateTopic(0);
}

function buildTopicTabs(){
  const box = document.getElementById("topicTabs");
  box.innerHTML = chapter.topics.map((t,i)=>
    `<button onclick="activateTopic(${i})" data-idx="${i}">${i+1}. ${esc(t.name)}</button>`
  ).join("");
}

function buildPanels(){
  const box = document.getElementById("panels");
  box.innerHTML = chapter.topics.map((t,i)=>`
    <div class="topic-panel" id="panel-${i}">
      <div class="video-card">
        <h2>第${i+1}集 · ${esc(t.name)}</h2>
        <div class="split">
          <!-- 左栏：视频 -->
          <div class="video-col">
            <video controls playsinline src="${t.video}"></video>
          </div>
          <!-- 右栏：自测题 -->
          <div class="quiz-col">
            <div class="ex-title">📝 课后自测</div>
            <div class="diff-tabs" id="difftabs-${i}">
              <button class="active" onclick="switchDiff(${i},'easy',this)">简单</button>
              <button onclick="switchDiff(${i},'mid',this)">中等</button>
              <button onclick="switchDiff(${i},'hard',this)">困难</button>
            </div>
            <div id="quiz-${i}"></div>
          </div>
        </div>
      </div>
    </div>
  `).join("");
  chapter.topics.forEach((t,i)=> renderQuiz(i,"easy"));
}

function activateTopic(idx){
  document.querySelectorAll(".topic-panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll("#topicTabs button").forEach(b=>b.classList.remove("active"));
  document.getElementById("panel-"+idx).classList.add("active");
  document.querySelector('#topicTabs button[data-idx="'+idx+'"]').classList.add("active");
}

function renderQuiz(topicIdx, diff){
  const list = chapter.topics[topicIdx].quiz[diff] || [];
  const box = document.getElementById("quiz-"+topicIdx);
  if(!list.length){ box.innerHTML = `<div class="qcard">该档暂无自测题。</div>`; return; }
  box.innerHTML = list.map((q,i)=>{
    const optText = q.options.map((o,j)=>`${LETTER[j]}.${esc(o)}`).join("  ");
    const ansText = LETTER[q.answer] + "." + esc(q.options[q.answer]) + (q.note ? "（"+esc(q.note)+"）" : "");
    return `<div class="qcard">
      <div class="qt"><b>${i+1}.</b>${esc(q.stem)}（${optText}）</div>
      <button class="ans-btn" onclick="toggleAns(this)">显示答案</button>
      <div class="ans">✅ 答案：${ansText}</div>
    </div>`;
  }).join("");
}

function toggleAns(btn){
  const card = btn.parentElement;
  card.classList.toggle("show");
  btn.textContent = card.classList.contains("show") ? "收起答案" : "显示答案";
}

function switchDiff(topicIdx, diff, btn){
  const tabs = document.getElementById("difftabs-"+topicIdx).querySelectorAll("button");
  tabs.forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderQuiz(topicIdx, diff);
}
</script>
</body>
</html>
