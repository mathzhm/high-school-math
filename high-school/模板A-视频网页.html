<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ★修改点1：把标题改成本章专题名，如"函数 · 视频复习" -->
<title>【专题名】· 视频复习</title>
<style>
  /* ===== 以下样式为固定规范，新章节无需改动 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f0f4f8; color: #333; padding: 20px; }
  h1 { text-align: center; color: #2c5f8a; margin-bottom: 20px; }
  .grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .card { flex: 1 1 320px; max-width: 400px; background: #fff; border-radius: 14px;
          box-shadow: 0 4px 14px rgba(0,0,0,.08); padding: 18px; }
  .card h2 { color: #2c5f8a; font-size: 18px; margin-bottom: 12px; text-align: center; }
  video { width: 100%; border-radius: 10px; background: #000; }

  /* 课后练习标题 */
  .ex-title { display:flex; align-items:center; gap:8px; margin:18px 0 12px;
              font-size:17px; font-weight:bold; color:#2c5f8a;
              border-left:5px solid #f0a020; padding-left:10px; }

  /* 胶囊难度标签 */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button { flex: 1; padding: 11px 0; border: none; cursor: pointer; font-size: 15px;
          font-weight:bold; background: #e6ecf3; color: #2c5f8a; border-radius: 24px;
          transition: all .2s; }
  .tabs button.active { background: #7bc47f; color: #fff; box-shadow:0 3px 8px rgba(123,196,127,.4); }

  /* 题目卡片 */
  .qcard { background:#f6f8fb; border-radius:12px; padding:16px; margin-bottom:14px; }
  .qcard .qt { font-size:15px; line-height:1.7; margin-bottom:12px; }
  .qcard .qt b { margin-right:4px; }
  .ans-btn { background:#5b7cd6; color:#fff; border:none; padding:9px 20px;
             border-radius:10px; cursor:pointer; font-size:14px; }
  .ans-btn:hover { background:#4a6ac0; }
  .ans { display:none; margin-top:12px; padding:12px; background:#fff;
         border-left:4px solid #f0a020; border-radius:8px;
         color:#d35400; font-weight:bold; line-height:1.6; }
  .qcard.show .ans { display:block; }
  .qcard.show .ans-btn { background:#9aa7bd; }

  footer { text-align: center; color: #999; margin-top: 24px; font-size: 13px; }

  /* 右下角固定吉祥物 */
  .mascot-fixed {
    position: fixed; right: 20px; bottom: 20px; width: 110px; z-index: 999;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.2)); transition: transform .3s;
  }
  .mascot-fixed:hover { transform: scale(1.08) rotate(-3deg); }
  @media (max-width: 600px) {
    .mascot-fixed { width: 70px; right: 10px; bottom: 10px; }
  }
  /* ===== 样式规范结束 ===== */
</style>
</head>
<body>
  <!-- ★修改点1：同步改成本章专题名 -->
  <h1>【专题名】· 视频复习</h1>

  <div class="grid">
    <!-- 第一集 -->
    <div class="card">
      <!-- ★修改点2：改成第一个知识点名 -->
      <h2>第一集 · 【知识点一】</h2>
      <!-- ★修改点4：改成第一集视频文件名 -->
      <video controls src="【视频1文件名】.mp4"></video>
      <div class="ex-title">📝 课后练习</div>
      <div class="tabs">
        <button class="active" onclick="switchTab(this,'l1')">简单</button>
        <button onclick="switchTab(this,'l1')">中等</button>
        <button onclick="switchTab(this,'l1')">困难</button>
      </div>
      <div id="l1"></div>
    </div>

    <!-- 第二集 -->
    <div class="card">
      <h2>第二集 · 【知识点二】</h2>
      <video controls src="【视频2文件名】.mp4"></video>
      <div class="ex-title">📝 课后练习</div>
      <div class="tabs">
        <button class="active" onclick="switchTab(this,'l2')">简单</button>
        <button onclick="switchTab(this,'l2')">中等</button>
        <button onclick="switchTab(this,'l2')">困难</button>
      </div>
      <div id="l2"></div>
    </div>

    <!-- 第三集 -->
    <div class="card">
      <h2>第三集 · 【知识点三】</h2>
      <video controls src="【视频3文件名】.mp4"></video>
      <div class="ex-title">📝 课后练习</div>
      <div class="tabs">
        <button class="active" onclick="switchTab(this,'l3')">简单</button>
        <button onclick="switchTab(this,'l3')">中等</button>
        <button onclick="switchTab(this,'l3')">困难</button>
      </div>
      <div id="l3"></div>
    </div>
  </div>

  <footer>活力酷酷兔数学小课堂 · 【专题名】专题</footer>

  <!-- 右下角固定吉祥物（文件名固定为 兔子.png） -->
  <img src="兔子.png" alt="活力酷酷兔" class="mascot-fixed">

<script>
/* =====================================================================
   ★修改点3：题库数据
   格式：DATA[集号][难度] = [ ["题干（选项写在括号内）", "答案"], ... ]
   规则：每集三档（简单/中等/困难），每档 3 道选择题。
   下方为占位示例，替换成本章实际题目即可，样式无需改动。
   ===================================================================== */
const DATA = {
  l1: {
    简单: [
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"]
    ],
    中等: [
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案（可加解析）"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"]
    ],
    困难: [
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案（可加解析）"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"]
    ]
  },
  l2: {
    简单: [
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"]
    ],
    中等: [
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"]
    ],
    困难: [
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"]
    ]
  },
  l3: {
    简单: [
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"]
    ],
    中等: [
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"]
    ],
    困难: [
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"],
      ["示例题干？（A.选项1 B.选项2 C.选项3 D.选项4）","答案"]
    ]
  }
};

/* ===== 以下逻辑为固定实现，无需改动 ===== */
function render(lesson, level){
  const arr = DATA[lesson][level];
  const box = document.getElementById(lesson);
  box.innerHTML = arr.map(([q,a],i)=>
    `<div class="qcard">
       <div class="qt"><b>${i+1}.</b>${q}</div>
       <button class="ans-btn" onclick="toggleAns(this)">显示答案</button>
       <div class="ans">✅ 答案：${a}</div>
     </div>`).join('');
}
function toggleAns(btn){
  const card = btn.parentElement;
  card.classList.toggle('show');
  btn.textContent = card.classList.contains('show') ? '收起答案' : '显示答案';
}
function switchTab(btn, lesson){
  const tabs = btn.parentElement.querySelectorAll('button');
  tabs.forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render(lesson, btn.textContent);
}
// 初始化：默认显示"简单"
['l1','l2','l3'].forEach(id=>render(id,'简单'));
</script>
</body>
</html>
