<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ★修改点1：改成本章专题名，如"函数 · 错题本系统" -->
<title>【专题名】· 错题本系统</title>
<style>
  /* ===== 以下样式为固定规范，新章节无需改动 ===== */
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei",sans-serif;background:#f0f4f8;color:#333;padding:20px;}
  h1{text-align:center;color:#2c5f8a;margin-bottom:16px;}
  .nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .nav button{padding:8px 18px;border:none;border-radius:20px;cursor:pointer;
     background:#e2eaf2;color:#2c5f8a;font-size:15px;}
  .nav button.active{background:#2c5f8a;color:#fff;}
  .panel{display:none;max-width:760px;margin:0 auto;}
  .panel.active{display:block;}
  .levels{display:flex;gap:6px;margin-bottom:14px;}
  .levels button{flex:1;padding:8px;border:none;cursor:pointer;background:#e2eaf2;color:#2c5f8a;border-radius:6px;}
  .levels button.active{background:#4a90d9;color:#fff;}
  .quiz{background:#fff;border-radius:12px;padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.07);margin-bottom:14px;}
  .quiz .qt{font-weight:bold;margin-bottom:10px;line-height:1.6;}
  .opt{display:block;padding:9px 12px;margin:6px 0;border:1px solid #dbe2ea;border-radius:8px;cursor:pointer;}
  .opt:hover{background:#f2f7fc;}
  .opt.correct{background:#d5f4e0;border-color:#27ae60;}
  .opt.wrong{background:#fbe0de;border-color:#e74c3c;}
  .opt.disabled{pointer-events:none;}
  .tools{text-align:center;margin:24px 0;}
  .tools button{margin:4px;padding:9px 18px;border:none;border-radius:8px;cursor:pointer;color:#fff;font-size:14px;}
  .b-view{background:#4a90d9;} .b-prev{background:#8e44ad;} .b-csv{background:#27ae60;} .b-clr{background:#e74c3c;}
  #wrongArea{max-width:760px;margin:0 auto;display:none;}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:13px;}
  th,td{border:1px solid #dde;padding:7px;text-align:left;}
  th{background:#2c5f8a;color:#fff;}
  #preview{display:none;max-width:760px;margin:0 auto;}
  .pcard{background:#fff;border-left:5px solid #8e44ad;border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .pcard .tag{display:inline-block;background:#8e44ad;color:#fff;font-size:12px;padding:2px 10px;border-radius:10px;}
  .pcard .t{font-size:12px;color:#999;float:right;}
  footer{text-align:center;color:#999;margin-top:24px;font-size:13px;}
  @media print{ .nav,.levels,.tools,.no-print,h1{display:none!important;}
    #preview{display:block!important;} .pcard{page-break-inside:avoid;} }
  /* ===== 样式规范结束 ===== */
</style>
</head>
<body>
  <!-- ★修改点1：同步改成本章专题名 -->
  <h1>【专题名】· 错题本系统</h1>

  <!-- ★修改点2：Tab导航，改成本章三个知识点名（与下方 panel 的 id 对应） -->
  <div class="nav">
    <button class="active" onclick="showPanel('p1',this)">【知识点一】</button>
    <button onclick="showPanel('p2',this)">【知识点二】</button>
    <button onclick="showPanel('p3',this)">【知识点三】</button>
  </div>

  <div id="p1" class="panel active"></div>
  <div id="p2" class="panel"></div>
  <div id="p3" class="panel"></div>

  <div class="tools no-print">
    <button class="b-view" onclick="toggleWrong()">📒 查看错题本</button>
    <button class="b-prev" onclick="togglePreview()">🔍 预览/打印</button>
    <button class="b-csv" onclick="downloadCSV()">💾 下载CSV备份</button>
    <button class="b-clr" onclick="clearWrong()">🗑 清空错题本</button>
  </div>

  <div id="wrongArea"><h3 style="text-align:center;color:#2c5f8a;margin-bottom:10px;">错题记录</h3><div id="wrongTable"></div></div>
  <div id="preview"></div>

  <footer>活力酷酷兔数学小课堂 · 错题自动记录于本机浏览器</footer>

<script>
/* =====================================================================
   ★修改点3：题库数据
   结构：QUESTIONS[面板id] = { name:"知识点名", 简单:[...], 中等:[...], 困难:[...] }
   每道题对象：{ q:"题干", opts:["选项A","选项B","选项C","选项D"], ans:正确项索引(0~3) }
   规则：三个知识点(p1/p2/p3)，各三档(简单/中等/困难)，每档 3 道选择题。
   name 会用于错题本的"知识点"字段，务必填准确。
   下方为占位示例，替换成本章实际题目即可，样式与逻辑无需改动。

   ★★修改点4（重要）：★ID一致性检查 ★★
   ① nav 里三个按钮的 showPanel('p1/p2/p3') 参数
   ② 三个 <div id="p1/p2/p3"> 的 id
   ③ 下方 QUESTIONS 的 p1/p2/p3 键
   三者必须一一对应，否则页面空白无法加载。
   ===================================================================== */
const QUESTIONS = {
  p1:{ name:"【知识点一】",
    简单:[
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:0},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:1},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:2}
    ],
    中等:[
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:0},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:1},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:2}
    ],
    困难:[
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:0},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:1},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:2}
    ]
  },
  p2:{ name:"【知识点二】",
    简单:[
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:0},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:1},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:2}
    ],
    中等:[
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:0},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:1},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:2}
    ],
    困难:[
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:0},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:1},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:2}
    ]
  },
  p3:{ name:"【知识点三】",
    简单:[
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:0},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:1},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:2}
    ],
    中等:[
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:0},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:1},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:2}
    ],
    困难:[
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:0},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:1},
      {q:"示例题干？",opts:["选项A","选项B","选项C","选项D"],ans:2}
    ]
  }
};

/* =====================================================================
   ★修改点5（可选）：localStorage 存储键名
   建议每个章节用不同键名，避免不同专题的错题混在一起。
   例如集合用 "set_wrongbook"，函数用 "func_wrongbook"。
   ===================================================================== */
const KEY = "【专题英文标识】_wrongbook";

/* ===== 以下逻辑为固定实现，无需改动 ===== */
const LETTER=["A","B","C","D"];
const STATE={p1:"简单",p2:"简单",p3:"简单"};

function buildPanel(pid){
  const panel=document.getElementById(pid);
  const levels=["简单","中等","困难"];
  let html=`<div class="levels">`+
    levels.map(l=>`<button class="${l===STATE[pid]?'active':''}" onclick="setLevel('${pid}','${l}',this)">${l}</button>`).join('')+
    `</div><div id="${pid}-q"></div>`;
  panel.innerHTML=html;
  renderQuestions(pid);
}
function setLevel(pid,lvl,btn){
  STATE[pid]=lvl;
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderQuestions(pid);
}
function renderQuestions(pid){
  const lvl=STATE[pid], list=QUESTIONS[pid][lvl];
  document.getElementById(pid+"-q").innerHTML=list.map((item,i)=>{
    const opts=item.opts.map((o,j)=>
      `<span class="opt" onclick="answer('${pid}','${lvl}',${i},${j},this)">${LETTER[j]}. ${o}</span>`).join('');
    return `<div class="quiz"><div class="qt">${i+1}. ${item.q}</div>${opts}</div>`;
  }).join('');
}
function answer(pid,lvl,qi,choice,el){
  const item=QUESTIONS[pid][lvl][qi];
  const parent=el.parentElement;
  parent.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
  if(choice===item.ans){
    el.classList.add('correct');
  }else{
    el.classList.add('wrong');
    parent.querySelectorAll('.opt')[item.ans].classList.add('correct');
    recordWrong({
      kp: QUESTIONS[pid].name,
      q: item.q,
      correct: LETTER[item.ans]+". "+item.opts[item.ans],
      wrong: LETTER[choice]+". "+item.opts[choice],
      time: new Date().toLocaleString('zh-CN')
    });
  }
}
/* ---- 错题本 localStorage ---- */
function getWrong(){ return JSON.parse(localStorage.getItem(KEY)||"[]"); }
function recordWrong(r){ const a=getWrong(); a.push(r); localStorage.setItem(KEY,JSON.stringify(a)); }
function clearWrong(){ if(confirm("确定清空全部错题记录？")){ localStorage.removeItem(KEY); renderWrongTable(); renderPreview(); } }

function toggleWrong(){
  const a=document.getElementById("wrongArea");
  document.getElementById("preview").style.display="none";
  a.style.display = a.style.display==="block"?"none":"block";
  renderWrongTable();
}
function renderWrongTable(){
  const data=getWrong();
  const box=document.getElementById("wrongTable");
  if(!data.length){ box.innerHTML="<p style='text-align:center;color:#999'>暂无错题，继续加油！</p>"; return;}
  box.innerHTML=`<table><tr><th>知识点</th><th>题目</th><th>正确答案</th><th>你的错误</th><th>时间</th></tr>`+
    data.map(r=>`<tr><td>${r.kp}</td><td>${r.q}</td><td>${r.correct}</td><td>${r.wrong}</td><td>${r.time}</td></tr>`).join('')+`</table>`;
}
function togglePreview(){
  const p=document.getElementById("preview");
  document.getElementById("wrongArea").style.display="none";
  if(p.style.display==="block"){ p.style.display="none"; return; }
  renderPreview(); p.style.display="block";
  setTimeout(()=>window.print(),300);
}
function renderPreview(){
  const data=getWrong();
  const p=document.getElementById("preview");
  if(!data.length){ p.innerHTML="<p style='text-align:center;color:#999'>暂无错题</p>"; return;}
  p.innerHTML=`<h3 style="text-align:center;color:#8e44ad;margin-bottom:14px;">错题复习卡</h3>`+
    data.map(r=>`<div class="pcard">
      <span class="tag">${r.kp}</span><span class="t">${r.time}</span>
      <p style="margin:10px 0;font-weight:bold;">${r.q}</p>
      <p style="color:#27ae60;">✅ 正确：${r.correct}</p>
      <p style="color:#e74c3c;">❌ 你选：${r.wrong}</p>
    </div>`).join('');
}
function downloadCSV(){
  const data=getWrong();
  if(!data.length){ alert("错题本为空，暂无可导出内容"); return; }
  let csv="\uFEFF知识点,题目,正确答案,错误答案,时间\n";
  data.forEach(r=>{
    csv+=`"${r.kp}","${r.q}","${r.correct}","${r.wrong}","${r.time}"\n`;
  });
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download="【专题名】错题本_"+new Date().toLocaleDateString('zh-CN')+".csv";
  link.click();
}
function showPanel(pid,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(pid).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
// 初始化
['p1','p2','p3'].forEach(buildPanel);
</script>
</body>
</html>
