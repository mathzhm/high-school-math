<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题本 · 高中数学复习</title>
<script src="chapters.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f6f9; color: #333; line-height: 1.6;
    padding: 20px; max-width: 900px; margin: 0 auto;
  }
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .btn-back {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; color: #4a90d9; border: 1px solid #d5e3f0;
    padding: 8px 16px; border-radius: 20px; font-size: 14px;
    text-decoration: none; cursor: pointer; transition: .2s; white-space: nowrap;
  }
  .btn-back:hover { background: #4a90d9; color: #fff; border-color: #4a90d9; }
  h1 { font-size: 22px; color: #2c3e50; }

  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .filter-chip {
    background: #fff; border: 1px solid #ddd; color: #666;
    padding: 6px 16px; border-radius: 16px; font-size: 14px;
    cursor: pointer; transition: .2s;
  }
  .filter-chip.active { background: #4a90d9; color: #fff; border-color: #4a90d9; }

  .sort-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 14px; color: #888; flex-wrap: wrap; }
  .sort-btn {
    background: #eef2f7; border: 1px solid #e0e6ee; color: #666;
    padding: 6px 16px; border-radius: 16px; font-size: 14px; cursor: pointer; transition: .2s;
  }
  .sort-btn.active { background: #5aa469; color: #fff; border-color: #5aa469; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .tool-btn {
    background: #4a90d9; color: #fff; border: none;
    padding: 9px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: .2s;
  }
  .tool-btn.gray { background: #7f8c9a; }
  .tool-btn.red  { background: #e07a5f; }
  .tool-btn:hover { opacity: .88; }

  .group-chapter {
    font-size: 18px; color: #2c3e50; font-weight: 700;
    margin: 22px 0 10px; padding-left: 10px; border-left: 4px solid #4a90d9;
  }
  .group-topic {
    font-size: 15px; color: #4a90d9; font-weight: 600; margin: 14px 0 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .group-topic .count {
    font-size: 12px; font-weight: 500; color: #fff; background: #f0a86a;
    border-radius: 10px; padding: 1px 9px;
  }

  .wrong-card {
    background: #fff; border-radius: 10px; padding: 16px 18px;
    margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .wrong-card .q { font-weight: 600; margin-bottom: 8px; }
  .wrong-card .meta { font-size: 13px; color: #999; margin-bottom: 8px; }
  .wrong-card .meta .tag {
    display: inline-block; background: #eef4fb; color: #4a90d9;
    border-radius: 6px; padding: 0 8px; margin-right: 6px; font-size: 12px;
  }
  .wrong-card .ans { font-size: 14px; }
  .wrong-card .ans .yours { color: #e07a5f; }
  .wrong-card .ans .right { color: #27ae60; }
  .wrong-card .del {
    float: right; font-size: 12px; color: #bbb; cursor: pointer; background: none; border: none;
  }
  .wrong-card .del:hover { color: #e07a5f; }

  .empty { text-align: center; color: #aaa; padding: 60px 20px; font-size: 15px; }

  @media print {
    .topbar .btn-back, .filter-bar, .sort-bar, .toolbar, .del { display: none !important; }
    body { background: #fff; }
    .wrong-card { box-shadow: none; border: 1px solid #eee; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <a class="btn-back" href="javascript:history.back()">← 返回上一页</a>
    <h1>📕 我的错题本</h1>
  </div>

  <div class="filter-bar" id="filterBar"></div>

  <div class="sort-bar">
    排序方式：
    <button class="sort-btn active" id="sortTopic" onclick="setSort('topic')">按知识点分类</button>
    <button class="sort-btn" id="sortTime" onclick="setSort('time')">按时间（最新在前）</button>
  </div>

  <div class="toolbar">
    <button class="tool-btn" onclick="window.print()">🖨️ 打印 / 预览</button>
    <button class="tool-btn gray" onclick="exportCSV()">📄 导出 CSV</button>
    <button class="tool-btn red" onclick="clearAll()">🗑️ 清空错题本</button>
  </div>

  <div id="list"></div>

<script>
  const STORAGE_KEY = 'math_wrong_book';
  const LEVEL_CN = { easy:'简单', mid:'中等', hard:'困难' };
  let currentFilter = '全部';
  let currentSort = 'topic';

  /* HTML 转义，防止题目里的 < > & 破坏页面结构 */
  function esc(s){
    return String(s ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  function loadWrong() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e) { return []; }
  }
  function saveWrong(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }

  function getChapters(data) {
    const set = new Set(data.map(x => x.chapter));
    return ['全部', ...Array.from(set)];
  }

  function renderFilter(data) {
    const bar = document.getElementById('filterBar');
    const chapters = getChapters(data);
    bar.innerHTML = chapters.map(c =>
      `<span class="filter-chip ${c === currentFilter ? 'active' : ''}"
             onclick="setFilter('${esc(c)}')">${esc(c)}</span>`
    ).join('');
  }

  function setFilter(c) { currentFilter = c; renderAll(); }

  function setSort(mode) {
    currentSort = mode;
    document.getElementById('sortTopic').classList.toggle('active', mode === 'topic');
    document.getElementById('sortTime').classList.toggle('active', mode === 'time');
    renderAll();
  }

  function cardHTML(x, showTags) {
    const tags = showTags
      ? `<span class="tag">${esc(x.chapter)}</span><span class="tag">${esc(x.topic)}</span>`
      : '';
    return `
      <div class="wrong-card">
        <button class="del" onclick="delOne('${x.id}')">删除 ✕</button>
        <div class="q">${esc(x.stem)}</div>
        <div class="meta">${tags}难度：${LEVEL_CN[x.level] || '—'}　${esc(x.time)}</div>
        <div class="ans">
          你的答案：<span class="yours">${esc(x.chosen) || '未作答'}</span>　
          正确答案：<span class="right">${esc(x.correct)}</span>
        </div>
      </div>`;
  }

  function renderList(data) {
    const list = document.getElementById('list');
    let items = data;
    if (currentFilter !== '全部') {
      items = data.filter(x => x.chapter === currentFilter);
    }
    if (items.length === 0) {
      list.innerHTML = '<div class="empty">🎉 暂无错题，继续加油！</div>';
      return;
    }

    let html = '';

    if (currentSort === 'time') {
      const sorted = [...items].sort((a, b) =>
        String(b.time || '').localeCompare(String(a.time || '')));
      html = sorted.map(x => cardHTML(x, true)).join('');
    } else {
      const groups = {};
      items.forEach(x => {
        groups[x.chapter] = groups[x.chapter] || {};
        groups[x.chapter][x.topic] = groups[x.chapter][x.topic] || [];
        groups[x.chapter][x.topic].push(x);
      });
      for (const ch in groups) {
        html += `<div class="group-chapter">${esc(ch)}</div>`;
        for (const tp in groups[ch]) {
          const arr = groups[ch][tp];
          html += `<div class="group-topic">${esc(tp)}<span class="count">${arr.length} 题</span></div>`;
          html += arr.map(x => cardHTML(x, false)).join('');
        }
      }
    }
    list.innerHTML = html;
  }

  function renderAll() {
    const data = loadWrong();
    renderFilter(data);
    renderList(data);
  }

  function delOne(id) {
    let data = loadWrong().filter(x => x.id !== id);
    saveWrong(data);
    renderAll();
  }

  function clearAll() {
    if (confirm('确定要清空所有错题吗？此操作不可恢复。')) {
      localStorage.removeItem(STORAGE_KEY);
      renderAll();
    }
  }

  function exportCSV() {
    let data = loadWrong();
    if (currentFilter !== '全部') data = data.filter(x => x.chapter === currentFilter);
    if (data.length === 0) { alert('没有可导出的错题'); return; }

    if (currentSort === 'time') {
      data.sort((a, b) => String(b.time || '').localeCompare(String(a.time || '')));
    } else {
      data.sort((a, b) => (a.chapter + a.topic).localeCompare(b.chapter + b.topic, 'zh'));
    }

    const head = ['章节', '知识点', '难度', '题目', '你的答案', '正确答案', '时间'];
    const rows = data.map(x => [
      x.chapter, x.topic, LEVEL_CN[x.level] || '',
      x.stem, x.chosen ?? '', x.correct, x.time || ''
    ]);
    const escCsv = v => `"${String(v).replace(/"/g, '""')}"`;
    const csv = '\uFEFF' + [head, ...rows]
      .map(r => r.map(escCsv).join(',')).join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '数学错题本.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

 function applyHash() {
   // 优先读 ?ch=，兼容旧的 #章节名
   const p = new URLSearchParams(location.search).get("ch");
   const h = p || decodeURIComponent(location.hash.replace('#','')).trim();
   if (h) currentFilter = h;
   renderAll();
 }


  window.addEventListener('hashchange', applyHash);
  applyHash();
</script>
</body>
</html>
